/* ---------- bulles ---------- */
let TY=null;
function say(txt,side){const kb=$('#kb'),p=$('#kbt');clearInterval(TY);p.innerHTML='';AVE.classList.add('talk');
 const r=AVE.getBoundingClientRect(),bw=kb.offsetWidth||380;
 if(!MOB()){let x=r.left+r.width/2-bw/2;x=Math.max(16,Math.min(innerWidth-bw-16,x));kb.style.left=x+'px';kb.style.top='auto';kb.style.bottom=(innerHeight-r.top+(innerHeight*.0)-10)+'px';kb.style.setProperty('--tx',(r.left+r.width/2-x-10)+'px')}
 kb.classList.add('on');let i=0;const w=txt.split(' ');TY=setInterval(()=>{i++;p.innerHTML=w.slice(0,i).join(' ')+'<span class="cur"></span>';if(i>=w.length){clearInterval(TY);setTimeout(()=>{p.innerHTML=txt;AVE.classList.remove('talk')},500)}},48)}

function botSay(t){const rb=$('#rb');$('#rbt').textContent=t;if(MOB())return;const w=240;let x=botX+BOT.offsetWidth/2-w/2;x=Math.max(12,Math.min(innerWidth-w-12,x));rb.style.left=x+'px';rb.style.top='auto';rb.style.bottom=(innerHeight-botY+14)+'px';rb.classList.add('on')}
/* ---------- navigation ---------- */
let CUR=-1,BUSY=false;
/* reprise : on retrouve l'écran exact par son bloc de texte, sinon par son chapitre */
function resumeIdx(){if(!(ST.last>0))return 1;if(ST.lastBlk>=0){const k=[...$$('.scr')].findIndex(sc=>[...sc.querySelectorAll('[data-b]')].some(e=>+e.dataset.b===ST.lastBlk));if(k>0)return k}
 if(ST.lastT==='chap'){const k=SCR.findIndex(x=>x.t==='chap'&&x.c===ST.lastC);if(k>0)return k}return Math.min(ST.last,SCR.length-1)}
function resume(){$('#toast').classList.remove('on');go(resumeIdx())}
function go(i,instant){i=Math.max(0,Math.min(SCR.length-1,i));if(i===CUR||BUSY&&!instant)return;BUSY=true;const prev=CUR,dir=i>prev?1:-1;CUR=i;ST.i=i;
 const s=SCR[i],el=$(`.scr[data-i="${i}"]`),old=prev>=0?$(`.scr[data-i="${prev}"]`):null;hush();
 if(old){old.classList.remove('show');old.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-dir*80}px)`}],{duration:450,easing:'cubic-bezier(.6,0,.4,1)'}).onfinish=()=>old.classList.remove('on')}
 setTimeout(()=>{el.classList.add('on');el.scrollTop=0;const pn=el.querySelector('.panel');if(pn)pn.scrollTop=0;
  el.animate([{opacity:0,transform:`perspective(1400px) translateX(${dir*120}px) rotateY(${-dir*14}deg) scale(.96)`,filter:'blur(8px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{duration:850,easing:'cubic-bezier(.16,1,.3,1)'});
  requestAnimationFrame(()=>el.classList.add('show'));showScene(s,el);SFX.attach(el.querySelector('.sch'));
  el.querySelectorAll('.sch').forEach(r=>{if(r._in&&!r._done){r._done=1;setTimeout(()=>r._in(),500)}});BUSY=false},instant?0:330);
 /* le monde avance */
 const wx=s.c<0?-WORLD.span*.35:s.c*WORLD.span+(SCR.filter((x,k)=>k<i&&x.c===s.c).length)*(WORLD.span/Math.max(3,SCR.filter(x=>x.c===s.c).length));
 instant?WORLD.jump(wx):WORLD.go(wx);
 /* l'avatar marche, puis parle */
 const pose=s.t==='hero'?'wave':s.pose;
 const pp=stagePlay(s,el,instant||prev<0,pose);(s.t==='chap'||s.t==='hero'?pp:Promise.resolve()).then(()=>{if(CUR!==i)return;
  if(s.t==='hero'){if(!MOB())say(u('hello'));setTimeout(()=>botSay(u('helloBot')),1600)}
  else if(s.t==='chap'){const S=ART.S[s.c];say(S.sum[L()]);setTimeout(()=>botSay(S.bot[L()]),2400)}});
 /* état */
 if(s.c>=0&&!ST.read.includes(s.c)&&SCR.findLastIndex?(SCR.findLastIndex(x=>x.c===s.c)===i):false){ST.read.push(s.c)}
 const fb=el.querySelector('[data-b]');ST.blk=fb?+fb.dataset.b:ST.blk;
 if(i>0){ST.last=i;ST.lastC=s.c;ST.lastT=s.t;ST.lastBlk=fb?+fb.dataset.b:-1}
 marks();save()}
function marks(){const s=SCR[CUR];$$('#chs button').forEach((b,k)=>{b.classList.toggle('on',s&&s.c===k);b.classList.toggle('read',ST.read.includes(k)||(s&&k<s.c));
  if(s&&s.c===k){const all=SCR.filter(x=>x.c===k),pos=all.indexOf(s);b.querySelector('i').style.width=((pos+1)/all.length*100)+'%'}else b.querySelector('i').style.width=''});
 $$('#tocl a').forEach((a,k)=>{a.classList.toggle('read',ST.read.includes(k));a.querySelector('small').textContent=ST.read.includes(k)?'✓ '+u('read'):''});
 $('#cnt').textContent=`${CUR+1} / ${SCR.length}`;$('#prev').disabled=CUR<=0;$('#next').disabled=CUR>=SCR.length-1;
 const c=$('#crumb');if(s&&s.c>=0){c.textContent=`${String(s.c+1).padStart(2,'0')} · ${ART.S[s.c].t[L()]}`;c.classList.add('on')}else c.classList.remove('on')}
$('#prev').onclick=()=>go(CUR-1);window.__ffgo=i=>go(i-1);$('#next').onclick=()=>go(CUR+1);
$('.brand').onclick=()=>go(0);
/* molette : on laisse d'abord défiler le panneau s'il déborde */
let wlock=0,acc=0;
addEventListener('wheel',e=>{if($('#toc').classList.contains('on'))return;const pn=e.target.closest('.panel');if(pn&&pn.scrollHeight>pn.clientHeight+4){const atB=pn.scrollTop+pn.clientHeight>=pn.scrollHeight-2,atT=pn.scrollTop<=0;if(e.deltaY>0&&!atB||e.deltaY<0&&!atT)return}
 e.preventDefault();const now=Date.now();if(now<wlock)return;acc+=e.deltaY+e.deltaX;if(Math.abs(acc)>40){go(CUR+(acc>0?1:-1));acc=0;wlock=now+900}},{passive:false});

$('#toc').onclick=e=>{if(e.target.id==='toc')$('#toc').classList.remove('on')};$('#btoc').onclick=()=>$('#toc').classList.add('on');

$$('#tlang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));$$('#ttheme button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));

 const r=AVE.getBoundingClientRect();const P=Array.from({length:220},()=>({x:r.left+r.width/2,y:r.top+r.height*.3,vx:(Math.random()-.5)*16,vy:-8-Math.random()*12,r:Math.random()*6,s:(Math.random()-.5)*.4,c:C[Math.floor(Math.random()*6)],w:6+Math.random()*6}));let n=0;
 (function f(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.s;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-3,p.w,6);g.restore()});if(++n<200)requestAnimationFrame(f);else g.clearRect(0,0,c.width,c.height)})()}

document.documentElement.dataset.theme=ST.theme;$$('#ttheme button').forEach(b=>b.classList.toggle('on',b.dataset.t===ST.theme));WORLD.theme(ST.theme==='dark');
$$('#tlang button').forEach(b=>b.classList.toggle('on',b.dataset.l===ST.lang));

if(RI>1&&RI<SCR.length){const s=SCR[RI];setTimeout(()=>{$('#toastt').textContent=`${u('toastR')} ${s.c>=0?String(s.c+1).padStart(2,'0')+' · '+ART.S[s.c].t[L()]:''}`;$('#toastb').textContent=u('toastB')+' →';$('#toast').classList.add('on');
