B:[
["lead","Une Frontier Firm est une entreprise de nouvelle génération qui mobilise le capital des expertises et connaissances consolidées par l’IA pour compléter celles de ses collaborateurs. Elle propose une nouvelle manière d’interagir avec ses données et ses processus, au moyen d’agents IA, d’applications modernes et d’une infrastructure pragmatique. Dans une telle organisation, des agents exécutent les tâches que les humains leur confient. Chaque collaborateur assure alors un rôle de supervision et adopte progressivement une posture de «\u00A0gestionnaire sachant\u00A0».","A Frontier Firm is a new-generation company that draws on the capital of expertise and knowledge consolidated by AI to complement that of its people. It offers a new way of interacting with its data and processes, through AI agents, modern applications and pragmatic infrastructure. In such an organisation, agents carry out the tasks humans entrust to them. Each employee then takes on a supervisory role and gradually adopts the stance of a “knowledgeable manager”."],
["p","L’organisation du travail s’articule donc davantage autour des résultats que de la hiérarchie : les équipes se composent autour d’objectifs et de compétences plutôt qu’en silos. Les agents rendent possible le décloisonnement des organisations, et cette évolution incite à repenser notre rapport à la collaboration ainsi que les modes de consommation et de production des données qui en découlent.","Work is therefore organised around outcomes more than hierarchy: teams form around objectives and skills rather than in silos. Agents make it possible to break down organisational walls, and this shift invites us to rethink how we collaborate, as well as the ways we consume and produce the data that flows from it."],
["p","L’avènement de l’IA Générative et de la révolution agentique qui lui succède pousse les organisations à tendre vers ce nouveau modèle d’entreprise.","The rise of Generative AI, and the agentic revolution that follows it, is pushing organisations towards this new business model."],
["schema","silos"]
]},
{id:"hist",k:{fr:"Héritage",en:"Legacy"},t:{fr:"Ce n’est pas la première rupture",en:"Not the first disruption"},pose:"explain",mood:"smile",scene:1,
sum:{fr:"Le PC et Internet ont fait de nous des Digital Firms. Le mobile et le cloud, des Mobile First & Cloud First Firms. La Frontier Firm est la suite logique : ces fondations, plus l’IA générative, plus les agents.",en:"PCs and the Internet made us Digital Firms. Mobile and cloud made us Mobile First & Cloud First Firms. The Frontier Firm is what comes next: those foundations, plus generative AI, plus agents."},
bot:{fr:"Frise interactive à venir : survolez chaque époque.",en:"Interactive timeline coming up: hover each era."},
B:[
["p","Ce n’est pas la première fois qu’une rupture technologique pousse les organisations à transformer considérablement leurs pratiques et leur stratégie. Nous pouvons ainsi mentionner différentes étapes majeures de la révolution numérique qui ont impacté durablement nos activités économiques et l’ensemble des entreprises quels que soient leur secteur et leur envergure :","This is not the first time a technological disruption has pushed organisations to transform their practices and strategy significantly. We can point to several major stages of the digital revolution that have had a lasting impact on our economic activity and on every company, whatever its sector or size:"],
["p","À partir de 1984, l’ordinateur personnel, doté d’une véritable interface utilisateur, se démocratise et enclenche la digitalisation de l’information. L’arrivée d’Internet à la fin des années 1990 accélère ce phénomène pour ensuite décloisonner l’information d’un appareil unique. Cette digitalisation a augmenté notre capacité à consommer et produire de plus larges volumes d’informations et de les propager en un temps record, dopant ainsi nos capacités collaboratives. Les organisations se sont alors transformées en de véritables Digital Firms.","From 1984 onwards, the personal computer, now with a real user interface, became mainstream and set off the digitisation of information. The arrival of the Internet in the late 1990s accelerated this, freeing information from any single device. This digitisation increased our ability to consume and produce ever larger volumes of information and to spread it in record time, boosting our capacity to collaborate. Organisations then became true Digital Firms."],
["p","Dès 2007, les smartphones et l’Internet mobile se développent, avant la démocratisation du cloud à partir de 2012. Cette combinaison débouche sur un véritable changement de paradigme, qui augmente encore, et à des échelles inenvisageables quelques années auparavant, les volumes de données que nous consommons et produisons tout en permettant la mobilité et l’accessibilité, partout et tout le temps. En effet, les données ne sont plus liées à une infrastructure fixe mais plutôt à des services qui suivent les organisations à tous moments et en tous lieux. Les organisations deviennent Mobile First & Cloud First Firms.","From 2007, smartphones and the mobile Internet took off, followed by the mainstreaming of the cloud from 2012. Together they brought a genuine paradigm shift, increasing yet again, on a scale unthinkable a few years earlier, the volume of data we consume and produce, while enabling mobility and access anywhere, at any time. Data was no longer tied to fixed infrastructure but to services that follow organisations wherever and whenever they work. Organisations became Mobile First & Cloud First Firms."],
["schema","timeline"],
["p","La Frontier Firm est donc la transformation qui résultera de ces fondations technologiques et du capital d’information produit, boosté par la puissance de l’IA Générative, et exploité par des systèmes agentique.","The Frontier Firm is therefore the transformation that will emerge from these technological foundations and the information capital they produced, boosted by the power of Generative AI and put to work by agentic systems."]
]},
{id:"why",k:{fr:"Pourquoi maintenant",en:"Why now"},t:{fr:"Pourquoi est-ce le moment pour la transformation en Frontier Firm ?",en:"Why is now the moment to become a Frontier Firm?"},pose:"think",mood:"think",scene:2,
sum:{fr:"Honnêtement ? On a surtout déplacé nos vieux processus dans le cloud. L’IA, elle, comprend le langage et l’intention : c’est l’occasion de repenser l’organisation entière, pas seulement d’empiler des cas d’usage.",en:"Honestly? We mostly moved old processes into the cloud. AI understands language and intent: that’s the chance to rethink the whole organisation, not just stack up use cases."},
bot:{fr:"Phrase-clé de la section mise en exergue.",en:"Key sentence of this section highlighted."},
B:[
["p","Malgré les ruptures technologiques successives, nos usages ont en réalité peu changé, sinon en surface. Nos usages métiers et nos processus ont bien profité de l’avènement de suites collaboratives comme Microsoft 365 pour absorber la démultiplication des données et l’accélération des rythmes collaboratifs, mais ils n’ont que très rarement été repensés en profondeur. Ainsi, nous travaillons encore largement de la même façon, en transposant dans le cloud les usages et processus auparavant hébergés sur site. Cette approche a eu des avantages, mais elle nous a habitués à adapter les nouvelles technologies à des processus existants, plutôt qu’à saisir l’occasion de repenser ces derniers pour les rendre plus fluides et plus modernes. Ainsi, la première approche des entreprises et de leurs conseils pour intégrer l’IA au sein de leurs organisations a été de traiter des cas d’usage spécifiques, jugés représentatifs de problématiques business et dignes d’opportunités de ROI, afin de les transformer en agents, sans une vision plus globale.","Despite successive technological disruptions, the way we work has changed very little, except on the surface. Our business practices and processes did benefit from collaboration suites like Microsoft 365 to absorb the explosion of data and the faster pace of collaboration, but they were very rarely rethought in depth. We still largely work the same way, simply moving to the cloud the practices and processes we once hosted on-premises. This approach had its advantages, but it got us used to fitting new technologies into existing processes rather than seizing the chance to rethink them and make them smoother and more modern. So the first move by companies and their advisers to bring AI into their organisations was to tackle specific use cases, seen as representative of business problems and promising ROI, and turn them into agents, without a broader vision."],
["p","Or, l’IA générative et les agents ouvrent de réelles possibilités de changements bien plus profonds pour l’ensemble d’une organisation, grâce à leur capacité à comprendre le langage naturel, voire, de plus en plus l’intention.","Yet generative AI and agents open up real possibilities for far deeper change across an entire organisation, thanks to their ability to understand natural language and, increasingly, intent."],
["p","Il ne s’agit pas seulement d’une opportunité de transition technologique, mais d’une véritable transformation organisationnelle à l’échelle de l’entreprise, dans toutes ses composantes, à tous les niveaux et dans le quotidien de chaque collaborateur.","This is not just an opportunity for a technology transition, but a genuine organisational transformation across the whole company, in all its parts, at every level and in every employee’s daily work."],
["pull","Une Frontier Firm n'est pas une entreprise qui utilise beaucoup d'IA. C'est une organisation qui redéfinit consciemment la répartition du travail, de la décision et de la responsabilité entre les humains, les agents et les applications.","A Frontier Firm is not a company that uses a lot of AI. It is an organisation that consciously redefines how work, decisions and accountability are shared between humans, agents and applications."]
]},
{id:"how",k:{fr:"Concrètement",en:"In practice"},t:{fr:"Et concrètement, comment s’y prendre\u00A0?",en:"So, in practice, how do we go about it?"},pose:"shrug",mood:"serious",scene:3,
sum:{fr:"Si ça coince, ce n’est pas faute de bénéfices. C’est le bruit ambiant et notre besoin de stabilité. D’où deux défis : l’organisation du travail, puis la technologie pour gouverner des milliers d’agents.",en:"If it stalls, it’s not for lack of benefits. It’s the noise and our need for stability. Hence two challenges: how work is organised, then the technology to govern thousands of agents."},
bot:{fr:"Deux défis identifiés. On les ouvre l’un après l’autre.",en:"Two challenges identified. We’ll open them one by one."},
B:[
["p","Si personne aujourd’hui ne doute des bénéfices que peut apporter l’IA à l’échelle individuelle ou à l’échelle de cas d’usage bien choisis, la route vers une industrialisation et vers une transformation organisationnelle semble toujours nous échapper : pourquoi\u00A0?","While nobody today doubts the benefits AI can bring to individuals or to well-chosen use cases, the road to scaling it and to organisational transformation still seems to elude us. Why?"],
["p","D’abord parce que le rythme des innovations, les actualités, les buzz, les enjeux géopolitiques, financiers, sécuritaires et les préoccupations de souveraineté qui entourent cette technologie viennent compromettre notre compréhension globale.","First, because the pace of innovation, the news cycle, the hype, and the geopolitical, financial, security and sovereignty concerns surrounding this technology get in the way of our overall understanding."],
["p","Aussi, et peut-être plus que jamais, parce que dans ce contexte perpétuellement mouvant et incertain, nous avons inconsciemment tendance à rechercher une forme de stabilité, culturelle, méthodologique, procédurale ou technologique. La résistance au changement est réelle.","Also, and perhaps more than ever, because in this constantly shifting and uncertain context we unconsciously look for some form of stability, whether cultural, methodological, procedural or technological. Resistance to change is real."],
["p","Prendre conscience des limites est donc le premier pas nécessaire pour aborder efficacement les défis de transformation qui se dressent devant nous. Ignorer ou négliger ces limites ne permettrait pas de s’inscrire dans une démarche suffisamment assumée à l’échelle de l’organisation et l’ambition ne pourrait s’inscrire durablement.","Recognising these limits is therefore the necessary first step to tackling the transformation challenges ahead. Ignoring or neglecting them would prevent a genuinely committed, organisation-wide approach, and the ambition could not last."],
["schema","challenges"],
["p","Ainsi, le premier défi transformationnel concerne l’organisation du travail : faire évoluer les processus, les modes de collaboration et de délégation, dans un contexte où l’IA orchestre une part croissante de nos tâches, et où les humains devront faire évoluer leur posture de collaborateur pour celle de gestionnaire d’agents.","The first transformation challenge is about how work is organised: evolving processes, ways of collaborating and delegating, in a context where AI orchestrates a growing share of our tasks and where humans will need to move from the stance of contributor to that of agent manager."],
["p","Le second défi est technologique et technique : implémenter, déployer et gouverner des milliers d’applicatifs agentiques et les faire coexister avec l’humain en totale transparence et confiance.","The second challenge is technological and technical: implementing, deploying and governing thousands of agentic applications and making them coexist with humans in full transparency and trust."]
]},
{id:"org",k:{fr:"Défi 1",en:"Challenge 1"},t:{fr:"Transformer l’organisation du travail",en:"Transforming how work is organised"},pose:"point",mood:"smile",scene:4,
sum:{fr:"Avant l’outil, il faut cadrer. Puis partir d’un postulat simple : l’IA comprend le langage. De là, quatre niveaux, de l’assistance à l’orchestration d’agents. Au bout, chacun devient gestionnaire d’agents.",en:"Before the tool comes the framing. Then a simple premise: AI understands language. From there, four levels, from assistance to orchestrating agents. At the end, everyone becomes an agent manager."},
bot:{fr:"Faites glisser le curseur pour passer d’un niveau à l’autre.",en:"Drag the slider to move between levels."},
B:[
["p","La majorité des projets de transformation digitale n’échoue pas par défaut technologique, mais plutôt en raison d’un mauvais cadrage de la problématique. Les directions peuvent investir massivement dans des licences et abonnements aux produits et services logiciels, dans des cas d’usage métiers choisis et des campagnes de conduite du changement, mais sans définir en amont les opportunités à l’échelle de l’organisation tout entière et le plan de mise en œuvre associé.","Most digital transformation projects don’t fail because of the technology, but because the problem was poorly framed. Leadership can invest heavily in software licences and subscriptions, selected business use cases and change-management campaigns, without first defining the opportunities across the whole organisation and the plan to deliver them."],
["p","Avant de parler d’outils et de programme d’accompagnement, il est nécessaire de cadrer ce que l’IA Générative a la capacité d’offrir en termes de potentiel transformationnel pour une organisation donnée. La question n’est donc pas seulement de savoir quelle IA choisir, quel agent déployer ou encore quel cas d’usage prioriser mais plutôt de comprendre dans quelle mesure notre organisation est prête à changer, par quels moyens et dans quel délai\u00A0?","Before talking about tools and adoption programmes, we need to frame what Generative AI can offer in terms of transformation potential for a given organisation. The question is not only which AI to choose, which agent to deploy or which use case to prioritise, but rather how ready our organisation is to change, by what means, and how fast."],
["p","Cela nécessite une prise de recul sur les capacités de l’IA Générative afin de se préserver du bruit et parfois du fantasme ambiant, en revenant au simple postulat que l’IA Générative a la capacité à comprendre le langage naturel. Et que cette capacité débloque de nouveaux scénarios de collaboration, de différents niveaux pour l’entreprise.","This requires stepping back from Generative AI’s capabilities to shield ourselves from the noise, and sometimes the fantasy, around it, and returning to a simple premise: Generative AI can understand natural language. And that ability unlocks new collaboration scenarios, at different levels, for the company."],
["schema","levels"],
["lvl","<b>Niveau 1\u00A0:</b> un collaborateur cherche de l’assistance auprès de l’IA Générative. Il sollicite l’IA pour trouver des réponses à ses questions ou effectuer des recherches avec le confort du langage naturel et d’un point d’entrée unique comme M365 Copilot ou un ChatGPT d’entreprise.","<b>Level 1:</b> an employee seeks assistance from Generative AI. They ask AI to find answers to their questions or run searches, with the comfort of natural language and a single entry point such as M365 Copilot or an enterprise ChatGPT."],
["lvl","<b>Niveau 2\u00A0:</b> un collaborateur entre dans une phase de collaboration avec l’IA. Il partage ses activités et ses idées et l’IA s’occupe de les matérialiser en livrable. On parle alors de collaboration synchrone avec une intelligence artificielle et/ou des agents. C’est déjà le cas avec M365 Copilot et ses fonctionnalités diverses de production documentaire par exemple.","<b>Level 2:</b> an employee enters a phase of collaboration with AI. They share their activities and ideas, and AI turns them into deliverables. This is synchronous collaboration with an artificial intelligence and/or agents. It is already the case with M365 Copilot and its many document-production features, for example."],
["lvl","<b>Niveau 3\u00A0:</b> un collaborateur délègue des tâches à l’IA. Il confie des objectifs à un agent, qui se chargera alors de mobiliser les connaissances et compétences adéquates sans supervision directe pour ensuite restituer un résultat qu’il faudra valider. Nous parlons alors de collaboration asynchrone. Copilot Cowork démocratise cette approche à l’échelle des organisations, aux côtés d’autres acteurs comme Claude Cowork ou OpenClaw","<b>Level 3:</b> an employee delegates tasks to AI. They hand objectives to an agent, which mobilises the right knowledge and skills without direct supervision and then returns a result that must be validated. This is asynchronous collaboration. Copilot Cowork is bringing this approach to organisations at scale, alongside others such as Claude Cowork or OpenClaw."],
["lvl","<b>Niveau 4\u00A0:</b> un collaborateur orchestre une équipe d’agents. Le collaborateur pilote un ensemble d’agents aux rôles, responsabilités, connaissances et compétences divers et variés. Les agents quant à eux se coordonnent pour répondre aux objectifs partagés par leur donneur d’ordre. Le collaborateur quant à lui porte la responsabilité de la coordination et du contrôle : il devient alors un gestionnaire d’agents.","<b>Level 4:</b> an employee orchestrates a team of agents. They steer a set of agents with diverse roles, responsibilities, knowledge and skills. The agents coordinate among themselves to meet the objectives set by the person who commissioned them. The employee is accountable for coordination and control: they become an agent manager."],
["p","Aujourd’hui, les organisations pilotent des personnes, animent des équipes et coordonnent des métiers. Dans une Frontier Firm, elles devront aussi intégrer les agents à ce travail collectif et faire collaborer humains et agents. L’enjeu n’est alors pas de remplacer l’humain par des agents mais de faire évoluer progressivement les tâches et missions des collaborateurs vers davantage d’innovation, de supervision et de planification.","Today, organisations manage people, lead teams and coordinate business functions. In a Frontier Firm, they will also have to bring agents into this collective work and make humans and agents collaborate. The point is not to replace humans with agents, but to gradually shift employees’ tasks and missions towards more innovation, supervision and planning."]
]},
{id:"modes",k:{fr:"L’information",en:"Information"},t:{fr:"Produire et consommer l’information autrement",en:"Producing and consuming information differently"},pose:"explain",mood:"happy",scene:5,
sum:{fr:"Les exigences ne changent pas : ROI, sécurité, gouvernance, conduite du changement. C’est la façon d’y répondre qui change. Trois modes émergent, et le self-service est celui qui révèle le mieux la Frontier Firm. Ce livre blanc en est d’ailleurs un exemple.",en:"The requirements stay the same: ROI, security, governance, change management. How we meet them changes. Three modes emerge, and self-service best reveals the Frontier Firm. This white paper is itself an example."},
bot:{fr:"Ce document que vous lisez ? Mode self-service.",en:"This document you’re reading? Self-service mode."},
B:[
["p","Par ailleurs, l’IA générative ne fait pas seulement évoluer le rôle des collaborateurs : elle invite également à repenser la manière dont l’entreprise produit et consomme l’information. Quelle que soit sa taille ou son secteur d’activité, toute organisation s’appuie sur des données qui bougent et évoluent dans le contexte de processus métiers. Ces processus métiers sont bien souvent adossés à des applicatifs devant répondre à 4 exigences\u00A0:","Generative AI doesn’t only change employees’ roles: it also invites us to rethink how the company produces and consumes information. Whatever its size or sector, every organisation relies on data that moves and evolves within business processes. Those processes are very often backed by applications that must meet 4 requirements:"],
["req","<b>Le retour sur investissement :</b> la valeur créée par les acteurs de ce processus","<b>Return on investment:</b> the value created by the people involved in the process"],
["req","<b>La sécurité :</b> la confidentialité et retenue nécessaires pour le traitement des informations","<b>Security:</b> the confidentiality and restraint required when handling information"],
["req","<b>La gouvernance :</b> le cadre, les responsabilités, le traitement des évolutions et les arbitrages nécessaires pour la pérennité de l’entreprise","<b>Governance:</b> the framework, responsibilities, change handling and trade-offs needed for the company’s long-term health"],
["req","<b>La conduite du changement :</b> l’accompagnement nécessaire pour une appropriation et une maîtrise complètes des processus métiers","<b>Change management:</b> the support needed for people to fully adopt and master business processes"],
["p","Si ces exigences ne changent pas avec l’IA générative, la manière d’y répondre, elle, évolue profondément. En réduisant la complexité technique et la pression liée à la production du livrable, l’IA nous permet de déplacer notre attention vers l’essentiel : la vision, l’intention et les idées que nous voulons concrétiser, y compris celles qui paraissaient jusqu’ici trop ambitieuses. Elle nous invite à penser autrement la réponse aux exigences citées plus haut.","These requirements don’t change with generative AI, but the way we meet them changes profoundly. By reducing technical complexity and the pressure of producing the deliverable, AI lets us shift our attention to what matters: the vision, the intent and the ideas we want to bring to life, including those that once seemed too ambitious. It invites us to think differently about how we meet the requirements above."],
["p","Désormais, l’IA générative fait émerger trois manières de produire et de consommer l’information, mais aussi d’interagir avec les processus métier :","Generative AI now brings out three ways of producing and consuming information, and of interacting with business processes:"],
["schema","modes"],
["mode","<b>Off-the-shelf :</b> met à disposition la donnée à travers des applicatifs SaaS, d’agent traditionnels ou d’applicatifs sur mesure. Ce mode est pensé pour une expérience bien spécifique à un ensemble de besoins. L’IA Générative ici est alors utilisée pour accélérer les développements, les déploiements et/ou les configurations.","<b>Off-the-shelf:</b> makes data available through SaaS applications, traditional agents or custom applications. This mode is designed for an experience specific to a set of needs. Generative AI is used here to speed up development, deployment and/or configuration."],
["fig","2b"],
["ex","Exemple\u00A0: Microsoft Teams et application de réservation de bureau codéveloppée avec GitHub Copilot","Example: Microsoft Teams and a desk-booking app co-developed with GitHub Copilot"],
["mode","<b>Hybrid :</b> le cadre reste défini par l’éditeur ou la DSI, mais l’IA générative compose à la demande une partie de l’expérience : texte, visuel ou composant d’application, directement dans la conversation.","<b>Hybrid:</b> the framework is still defined by the vendor or IT, but generative AI composes part of the experience on demand: text, visuals or an application component, right inside the conversation."],
["fig","3"],
["ex","Exemple : Agent Copilot Studio restituant du texte mais aussi un morceau d’application générée dans la conversation. Source : <a href=\"https://github.com/RomainTheLowCodeBeardedBear\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/RomainTheLowCodeBeardedBear</a>","Example: a Copilot Studio agent returning text as well as a piece of application generated in the conversation. Source: <a href=\"https://github.com/RomainTheLowCodeBeardedBear\" target=\"_blank\" rel=\"noopener noreferrer\">https://github.com/RomainTheLowCodeBeardedBear</a>"],
["mode","<b>Self-service\u00A0:</b> la donnée devient le seul référentiel. L’IA générative la met en forme dans le support qui sert le mieux l’intention : une présentation, un tableau de bord HTML interactif, une application, etc.","<b>Self-service:</b> data becomes the only reference. Generative AI shapes it into whatever format best serves the intent: a presentation, an interactive HTML dashboard, an application, and so on."],
["fig","4"],
["ex","Exemple\u00A0: Dashboard HTML produit par Copilot.","Example: an HTML dashboard produced by Copilot."]
]},
{id:"story",k:{fr:"Vécu",en:"Lived experience"},t:{fr:"Partir du problème et de l’intention",en:"Starting from the problem and the intent"},pose:"sip",mood:"wink",scene:6,
sum:{fr:"Je l’ai vécu : partir du constat (qui suit vraiment un webinaire ?), imaginer sans contrainte, puis co-produire des jeux vidéo de formation avec Copilot. 100 % de complétion, plus de 90 % d’assimilation. Et beaucoup de nouvelles questions.",en:"I lived it: start from the problem (who really follows a webinar?), imagine freely, then co-produce training video games with Copilot. 100% completion, over 90% retention. And plenty of new questions."},
bot:{fr:"Chiffres issus d’un premier test, une dizaine de testeurs.",en:"Figures from a first test with about ten testers."},
B:[
["p","C’est ce dernier mode qui, à mes yeux, révèle le mieux le potentiel de transformation de la Frontier Firm. Non pas parce qu’il permet simplement de produire plus vite, mais parce qu’il permet de partir du problème et de l’intention avant de se demander quel outil utiliser. C’est exactement ce que j’ai expérimenté en travaillant sur une nouvelle offre de formation.","In my view, it is this last mode that best reveals the transformative potential of the Frontier Firm. Not because it simply lets us produce faster, but because it lets us start from the problem and the intent before asking which tool to use. That is exactly what I experienced while working on a new training offer."],
["p","Depuis des années, la formation à distance (webinaires, e-learning) offre un bon compromis entre coût, volume, couverture géographique et logistique. Mais elle répond d’abord à ces contraintes, avant de servir ce qui fait une formation réussie : l’engagement, la complétion, l’assimilation. Qui n’a jamais suivi un webinaire de formation en travaillant sur autre chose ? En partant de ce constat je me suis mis à réfléchir en me libérant du poids de la solution cible pour laisser libre cours à mon imagination. J’imaginais alors un parcours ludique, innovant et original tranchant avec les modes de consommation traditionnel de contenus en entreprise\u00A0: je me suis orienté vers le jeu vidéo avec des univers uniques par module et par contexte client.","For years, remote training (webinars, e-learning) has offered a good compromise between cost, volume, geographic reach and logistics. But it answers those constraints first, before serving what makes training succeed: engagement, completion, retention. Who has never sat through a training webinar while working on something else? Starting from that observation, I began thinking without the weight of a target solution and let my imagination run. I pictured a playful, innovative and original journey that broke with the traditional ways content is consumed at work: I turned to video games, with a unique world for each module and each client context."],
["p","Avec M365 Copilot, j’ai pu matérialiser ces univers par itérations successives, sans passer par une équipe de développement, et en faire une nouvelle offre de formation.","With M365 Copilot, I was able to bring these worlds to life through successive iterations, without going through a development team, and turn them into a new training offer."],
["fig","5","Imaginé et conceptualisé par l’humain, co-produit avec M365 Copilot.","Imagined and designed by a human, co-produced with M365 Copilot."],
["p","Ma connaissance et ma passion du jeu vidéo ont fait le reste : Copilot m'a permis de les transformer en une réponse concrète, ancrée dans un besoin réel. Résultat\u00A0des premiers tests sur une population d’une dizaine de testeurs : des retours unanimement positifs et un réel enthousiasme à lancer les modules, une complétion de 100% peu importe la durée du jeu et une assimilation des connaissances à plus de 90% à travers des tests de connaissances intégrés sous la forme de mini-boss et boss de fin.","My knowledge of and passion for video games did the rest: Copilot let me turn them into a concrete answer rooted in a real need. Results from the first tests with about ten testers: unanimously positive feedback and real enthusiasm to launch the modules, 100% completion regardless of game length, and over 90% knowledge retention measured through built-in knowledge checks in the form of mini-bosses and final bosses."],
["schema","stats"],
["p","Présenté à des clients, le format suscite le même intérêt, avec des demandes pour l’adapter à leurs propres enjeux.","When presented to clients, the format sparks the same interest, with requests to adapt it to their own challenges."],
["p","Cette expérience, aussi positive soit-elle, amène son lot de questions. Que se passe-t-il si demain le mode self-service devient le canal de consommation et de production de données majoritaire\u00A0? De quoi devrais-je m’assurer si je souhaitais demain sous-traiter la conception de ces modules de formation à un agent\u00A0? Est-ce que les données sur lesquelles je me base sont bonnes et fiables\u00A0? Quid de l’impact financier si je souhaite doter tous les collaborateurs de mon entreprise des mêmes fonctionnalités d’IA Générative\u00A0? Etc. Vous l’aurez compris, une mutation organisationnelle d’une aussi grande ampleur doit absolument être accompagnée de son pendant technologique.","However positive, this experience raises its share of questions. What happens if, tomorrow, self-service becomes the main channel for consuming and producing data? What would I need to make sure of if I wanted to hand the design of these training modules over to an agent? Is the data I rely on sound and reliable? What about the financial impact if I want to give every employee in my company the same Generative AI capabilities? And so on. As you will have gathered, an organisational shift of this scale absolutely must be matched by its technological counterpart."]
]},
{id:"id",k:{fr:"Défi 2 · Pilier 1",en:"Challenge 2 · Pillar 1"},t:{fr:"Mutation technologique · Identités & Sécurité",en:"Technological shift · Identity & Security"},pose:"serious",mood:"serious",scene:7,
sum:{fr:"Un agent doit être géré comme un collaborateur virtuel : identité, propriétaire, droits, traçabilité, de l’arrivée au départ. Mais une limite reste non négociable : la responsabilité, elle, est toujours humaine.",en:"An agent must be managed like a virtual employee: identity, owner, rights, traceability, from arrival to departure. But one line stays non-negotiable: accountability is always human."},
bot:{fr:"Et oui : moi aussi, j’ai besoin d’un propriétaire.",en:"And yes: I need an owner too."},
B:[
["p","Cette transformation doit venir poser le cadre et les fondations permettant l’ensemble des mutations organisationnelles évoquées plus haut. Je vois cette mutation technologique reposer sur 2 piliers\u00A0: Identités & Sécurité d’une part, Device & Services de l’autre.","This transformation must lay the framework and foundations for all the organisational changes described above. I see this technological shift resting on 2 pillars: Identity & Security on one side, Devices & Services on the other."],
["h3","Identités & Sécurité","Identity & Security"],
["p","Ce premier pilier consiste à gérer les agents comme des collaborateurs virtuels, avec des identités, des droits et une traçabilité spécifique. Aujourd’hui, les organisations gèrent les identités humaines au moyen de l’authentification unique, de l’authentification multifacteurs renforcée et des accès conditionnels. Chaque utilisateur dispose de droits et d’un périmètre défini. Demain, il faudra appliquer une ensemble de principes équivalents pour les agents.","This first pillar is about managing agents as virtual employees, with their own identities, rights and traceability. Today, organisations manage human identities through single sign-on, strong multi-factor authentication and conditional access. Each user has defined rights and a defined scope. Tomorrow, an equivalent set of principles will have to apply to agents."],
["p","Les agents ne se contenteront progressivement plus uniquement de consommer et de restituer de l’information. Ils exécuteront aussi des actions avec ou sans notre supervision, avec parfois même une délégation étendue de certaines de nos autorisations. Il devient donc nécessaire de les traiter comme des «\u00A0collaborateurs virtuels\u00A0», disposant d’une identité propre d’un point de vue technique, d’un périmètre défini et de droits délimités et traçables, comme ce serait le cas pour tout collaborateur ou prestataire intervenant au sein d’une organisation. Cette comparaison doit néanmoins maintenir une limite essentielle : un agent intervient sur un périmètre, mais la responsabilité reste exclusivement humaine.","Agents will gradually do more than consume and return information. They will also take actions, with or without our supervision, sometimes with broad delegation of some of our permissions. So it becomes necessary to treat them as “virtual employees”, with their own technical identity, a defined scope, and bounded, traceable rights, just as for any employee or contractor working within an organisation. The comparison must nonetheless keep one essential limit: an agent acts within a scope, but accountability remains exclusively human."],
["schema","lifecycle"],
["p","Cette évolution nous oblige à imaginer un cycle de vie des agents dans son ensemble. Leur «\u00A0arrivée\u00A0» en environnement de production suppose l’attribution d’une identité, d’un propriétaire, d’un périmètre et des prérogatives associées. Leur évolution nécessite de suivre leurs nouvelles compétences induites par l’évolution des technologies, leurs changements de version induits par l’évolution des besoins métiers et de tracer les dérives éventuelles afin de détecter en amont des comportement déviants et empêcher ainsi la répétition d’événements comme le dossier OpenAI/Hugging Face. Leur «\u00A0départ\u00A0» implique enfin de révoquer leurs accès, de décommissionner les agents devenus inutiles et de reprendre ceux qui seraient devenus «\u00A0orphelins\u00A0». Si les RH continueront de piloter le cycle de vie des personnes, les DSI devront assurer celui des agents. Mais ni les RH ni la DSI ne pourront décider seules : les métiers devront exprimer le besoin, et le management fixer les objectifs, déterminer ce qui peut être délégué ou non, choisir jusqu’où cette délégation peut aller, puis superviser et valider le résultat.","This shift forces us to think about the agent lifecycle as a whole. Their “arrival” in production requires assigning an identity, an owner, a scope and the associated prerogatives. Their evolution requires tracking new skills brought by evolving technology and version changes driven by evolving business needs, and tracing any drift so that deviant behaviour is detected early and events like the OpenAI/Hugging Face case are not repeated. Finally, their “departure” means revoking access, decommissioning agents that are no longer useful and taking over those that have become “orphaned”. While HR will continue to manage the lifecycle of people, IT will have to manage that of agents. But neither HR nor IT can decide alone: the business must express the need, and management must set objectives, decide what can and cannot be delegated, how far that delegation can go, and then supervise and validate the result."],
["p","Cette gouvernance devra aussi tenir compte d’une difficulté nouvelle : un agent peut être conçu pour accéder à un périmètre d’information plus large que celui de la personne qui l’utilise. L’ensemble des acteurs au sein d’une organisation devront alors décider conjointement des accès et de l’audience de tels agents, appliquer le principe du moindre privilège, journaliser ses activités et prévoir des mécanismes explicites de contrôle, d’audit, d’escalade et de révocation. La question ne sera plus uniquement de savoir ce qu’un agent sait faire, mais ce qu’il est autorisé à faire, pour qui, sous quel niveau de supervision et avec quelles conséquences en cas d’erreur. Les organisations seront confrontées à la même problématique que les voitures autonomes de niveau 5\u00A0: en cas d’accident, qui porte la responsabilité\u00A0?","This governance will also have to deal with a new difficulty: an agent can be designed to access a wider scope of information than that of the person using it. Everyone involved in an organisation will then have to decide jointly on such agents’ access and audience, apply the principle of least privilege, log their activity, and put in place explicit mechanisms for control, audit, escalation and revocation. The question will no longer be only what an agent can do, but what it is allowed to do, for whom, under what level of supervision, and with what consequences if it makes a mistake. Organisations will face the same problem as level-5 self-driving cars: in the event of an accident, who is accountable?"],
["p","À cela s’ajoutent des enjeux de conformité et de souveraineté, qui dépendront des cas d’usage et de la sensibilité des données manipulées. Certains arbitrages pourront être outillés, mais d’autres resteront profondément humains : quelles connaissances souhaitons-nous réellement confier à un agent ? Jusqu’où voulons-nous déléguer nos processus, nos décisions ou une partie de notre jugement ? Comment préserver notre souveraineté intellectuelle et notre capacité à penser par nous-mêmes ?","On top of this come compliance and sovereignty issues, which will depend on the use cases and the sensitivity of the data involved. Some trade-offs can be supported by tools, but others will remain deeply human: what knowledge do we really want to entrust to an agent? How far do we want to delegate our processes, our decisions, or part of our judgement? How do we preserve our intellectual sovereignty and our ability to think for ourselves?"],
["p","La personnification croissante des agents rendra cet accompagnement d’autant plus important. En leur donnant un nom, un visage ou une personnalité, nous facilitons clairement leur appropriation, mais nous créons aussi un risque de confusion sur leur véritable nature. Cette personnification devra être prise en compte dans l’accompagnement des collaborateurs. Il faudra les préparer à leur rôle de superviseur, de gestionnaire et même «\u00A0Manager d’agents\u00A0». Une responsabilité nouvelle à exercer, en évitant l’influence de ce mimétisme anthropologique et le piège d’un anthropomorphisme inapproprié et dangereux. Manager un agent ne consistera pas à manager une personne artificielle, mais à gouverner une capacité numérique dont l’humain devra rester comptable.","The growing personification of agents will make this support all the more important. Giving them a name, a face or a personality clearly makes them easier to adopt, but it also creates a risk of confusion about their true nature. This personification will need to be addressed when supporting employees. They will have to be prepared for their role as supervisor, manager and even “agent manager”. A new responsibility to exercise, while avoiding the pull of this anthropological mimicry and the trap of inappropriate and dangerous anthropomorphism. Managing an agent will not mean managing an artificial person, but governing a digital capability for which humans must remain accountable."],
["p","L’idée n’est donc pas d’affirmer que les agents remplaceront les humains, ce qui ouvrirait un autre débat, mais de préparer les organisations à une réalité progressive : leurs permissions et leur champ d’action s’élargiront à mesure que les technologies évolueront. Leur intégration ne pourra pas être traitée comme un simple sujet technique. Elle modifiera également le rôle des collaborateurs, appelés à devenir superviseurs, gestionnaires et parfois « managers d’agents ».","So the idea is not to claim that agents will replace humans, which would open another debate, but to prepare organisations for a gradual reality: agents’ permissions and scope of action will widen as technology evolves. Integrating them cannot be treated as a purely technical topic. It will also change the role of employees, who will be called on to become supervisors, managers and sometimes “agent managers”."]
]},
{id:"dev",k:{fr:"Défi 2 · Pilier 2",en:"Challenge 2 · Pillar 2"},t:{fr:"Devices & Services",en:"Devices & Services"},pose:"think",mood:"think",scene:8,
sum:{fr:"Où doit tourner l’intelligence ? Le cloud est rapide mais crée de la dépendance, et les tokens ont un coût. Le local reprend la main mais coûte en CAPEX. Ma conviction : un hybride, piloté cas par cas, en logique FinOps.",en:"Where should intelligence run? Cloud is fast but creates dependency, and tokens have a cost. Local regains control but costs CAPEX. My view: a hybrid, steered case by case, with a FinOps mindset."},
bot:{fr:"Jouez avec le simulateur : il illustre l’arbitrage, il ne décide pas.",en:"Play with the simulator: it illustrates the trade-off, it doesn’t decide."},
B:[
["p","Le second pilier doit permettre à l’organisation de décider où doit s’exécuter l’intelligence. L’arbitrage entre le cloud et les infrastructures hybrides ou locales aura un impact sur les performances, la souveraineté et la maîtrise des coûts d’une Frontier Firm.","The second pillar must allow the organisation to decide where intelligence should run. The trade-off between cloud and hybrid or local infrastructure will affect a Frontier Firm’s performance, sovereignty and cost control."],
["p","Aujourd’hui, la plupart des cas d’usage liés à l’intelligence artificielle et aux agents dépendent d’infrastructures cloud et d’une économie IaaS, PaaS et SaaS ou en un mot\u00A0: Cloud.","Today, most AI and agent use cases depend on cloud infrastructure and an IaaS, PaaS and SaaS economy, or in a word: Cloud."],
["p","Le déploiement est rapide, les mises à jour sont continues et les coûts opérationnels régis par une logique OPEX sont relativement prévisibles.","Deployment is fast, updates are continuous, and operating costs, governed by OPEX, are relatively predictable."],
["p","Cependant, cette approche crée une dépendance réelle vis-à-vis des fournisseurs et implique que les données et certains processus soient hébergés en dehors de l’organisation. Même si les hyperscalers garantissent le respect du droit applicable dans leurs pays d’exploitation, les tensions géopolitiques récentes peuvent susciter des inquiétudes pour les organisations européennes, asiatiques ou d’autres régions.","However, this approach creates real dependency on providers and means that data and some processes are hosted outside the organisation. Even though hyperscalers guarantee compliance with the applicable law in their countries of operation, recent geopolitical tensions can raise concerns for organisations in Europe, Asia and other regions."],
["p","Au-delà de ces enjeux se pose la question de la «\u00A0tokenomie\u00A0» : chaque appel à un grand modèle de langage a un coût lié aux tokens consommés. Gouverner cette consommation, optimiser les prompts et éviter les usages non maîtrisés devient donc une nécessité. Pour reprendre l’image utilisée par le dirigeant de Nvidia, les machines à vapeur transformaient l’énergie en biens pendant la révolution industrielle ; à l’ère de l’IA générative, les <i>data centers</i> transforment l’énergie en tokens.","Beyond these issues lies the question of “tokenomics”: every call to a large language model has a cost tied to the tokens consumed. Governing that consumption, optimising prompts and avoiding uncontrolled usage becomes a necessity. To borrow the image used by Nvidia’s CEO, steam engines turned energy into goods during the industrial revolution; in the age of generative AI, <i>data centres</i> turn energy into tokens."],
["schema","tokens"],
["p","J’ai la certitude que le coût des tokens évoluera dans le temps sous l’effet de plusieurs facteurs : la complexité et l’évolution des capacités inhérentes à l’évolution des modèles, le montant des investissements pour le développement de nouvelles infrastructures.","I am certain that the cost of tokens will change over time under the effect of several factors: the complexity and growing capabilities that come with evolving models, and the level of investment in developing new infrastructure."],
["p","À cela s’ajoutent les moratoires qui naissent dans certains pays ou certaines villes, suite au refus des populations à d’accueillir la construction de nouveaux data centers à proximité de leur domicile, les tensions en termes d’approvisionnement au niveau des composants essentiels au fonctionnement de l’IA comme la mémoire, les CPU/GPU, et enfin le mur énergétique qui se dresse peu à peu devant nous en termes d’électricité et d’eau.","Add to this the moratoriums emerging in some countries and cities as residents refuse new data centres near their homes, supply tensions on components essential to AI such as memory and CPUs/GPUs, and finally the energy wall gradually rising before us in terms of electricity and water."],
["p","Sur ce dernier point, certaines entreprises comme SpaceX ou Google envisagent même à moyen/long terme d’envoyer des data centers dans l’espace pour répondre aux problématiques foncières et énergétiques évoquées plus haut.","On that last point, some companies such as SpaceX and Google are even considering, in the medium to long term, sending data centres into space to address the land and energy issues mentioned above."],
["p","Lorsque l’on met bout à bout ces éléments, nous comprenons qu’une dépendance exclusive au cloud peut rapidement devenir problématique pour une entreprise et que résumer la notion de souveraineté au seul angle de la résidence de la donnée est problématique. Le pilier «\u00A0Device & Services\u00A0» doit étendre la souveraineté plus largement en incluant la dimension financière, stratégique, intellectuelle, sécuritaire et procédurale.","Putting these elements together, we can see that exclusive dependence on the cloud can quickly become a problem for a company, and that reducing sovereignty to data residency alone is a problem too. The “Devices & Services” pillar must extend sovereignty more broadly, to include its financial, strategic, intellectual, security and procedural dimensions."],
["schema","sovereignty"],
["p","Les actualités récentes, comme le partenariat entre Microsoft et Nvidia pour la conception de Spark PC, le positionnement d’Apple avec ses ordinateurs et ses puces maison, ou encore les «\u00A0AI PC\u00A0» d’AMD nous montrent clairement la voie vers l’IA locale. L’inférence locale ouvre la voie vers une meilleure maîtrise de ses critères de souveraineté en fonction de leur criticité pour un contexte donné.","Recent news, such as the Microsoft–Nvidia partnership on Spark PCs, Apple’s positioning with its own computers and in-house chips, or AMD’s “AI PCs”, clearly point the way towards local AI. Local inference opens the door to better control over one’s sovereignty criteria, depending on how critical they are in a given context."],
["p","Cette approche présente néanmoins des inconvénients. Elle ramène l’entreprise vers une logique d’investissement CAPEX, avec un coût d’acquisition matériel élevé, des modèles à maintenir à jour et une puissance limitée par l’infrastructure disponible. Elle offre en revanche une meilleure maîtrise des coûts grâce à une logique d’amortissement et donc une certaine forme de souveraineté financière.","This approach does have drawbacks. It takes the company back to a CAPEX investment model, with high hardware acquisition costs, models to keep up to date, and power limited by the available infrastructure. On the other hand, it offers better cost control through depreciation, and therefore a certain form of financial sovereignty."],
["schema","sim"],
["p","Une approche hybride pourrait donc être pertinente : une combinaison optimisée selon la sensibilité des données, la criticité des processus et le niveau de dépendance acceptables vis-à-vis des éditeurs. Certains processus ne peuvent pas, pour des raisons de souveraineté intellectuelle, de processus ou financière, dépendre entièrement d’un hyperscaler. Cette approche doit être adaptée à chaque cas d’usage et suppose une gouvernance claire du portefeuille et de l’intelligence.","A hybrid approach could therefore make sense: a combination optimised according to data sensitivity, process criticality and the acceptable level of dependency on vendors. Some processes cannot, for reasons of intellectual, process or financial sovereignty, depend entirely on a hyperscaler. This approach must be tailored to each use case and requires clear governance of the portfolio and of intelligence."],
["p","Nous entrons ici dans une logique FinOps, où doivent être suivis les modèles d’investissement et de fonctionnement, les tableaux de bord de consommation, les seuils d’alerte et la répartition des coûts par équipe. La souveraineté devra également être arbitrée entre hyperscalers mondiaux et solutions souveraines européennes ou nationales, selon la criticité des données, les contraintes réglementaires applicables, et les ambitions de l’entreprise.","This is where FinOps comes in: investment and operating models, consumption dashboards, alert thresholds and cost allocation by team must all be tracked. Sovereignty will also have to be weighed between global hyperscalers and European or national sovereign solutions, depending on data criticality, applicable regulatory constraints and the company’s ambitions."]
]},
{id:"path",k:{fr:"Le bon bout",en:"The right end"},t:{fr:"Se poser les bonnes questions et prendre le problème par le bon bout",en:"Asking the right questions and tackling the problem from the right end"},pose:"point",mood:"smile",scene:9,
sum:{fr:"Diagnostic avant technologie. Cinq signaux pour mesurer l’impact, une trajectoire de 12 à 24 mois, six chantiers, un sponsor au plus haut niveau. Le livrable n’est plus le sujet : ce sont les idées.",en:"Diagnosis before technology. Five signals to measure impact, a 12–24 month trajectory, six workstreams, sponsorship at the very top. The deliverable is no longer the point: ideas are."},
bot:{fr:"Cliquez sur les signaux et les chantiers pour les explorer.",en:"Click the signals and workstreams to explore them."},
B:[
["p","Nous le voyons : la Frontier Firm redistribue les cartes de ce que doit être une entreprise à l’ère de l’IA. La transformation organisationnelle implique de nouveaux rôles, une stratégie d’investissement à revoir, et des usages de l’IA à refondre à l’échelle de l’organisation, plutôt que de se limiter à quelques cas isolés. Elle suppose aussi un travail sur la gouvernance humaine et sur la capitalisation des compétences : quelles compétences doivent rester humaines ? Lesquelles peuvent être confiées à l’IA, et dans quel cadre ? Comment s’assurer d’une non-homogénéisation de la pensée et de l’intelligence ? Comment empêcher une perte de souveraineté intellectuelle ?","As we can see, the Frontier Firm reshuffles the cards of what a company should be in the age of AI. Organisational transformation involves new roles, a rethought investment strategy, and AI usage redesigned across the organisation rather than confined to a few isolated cases. It also calls for work on human governance and on building up skills: which skills must remain human? Which can be entrusted to AI, and within what framework? How do we avoid homogenising thought and intelligence? How do we prevent a loss of intellectual sovereignty?"],
["p","La transformation technologique est tout aussi importante. Elle concerne l’identité et la sécurité des agents par rapport aux humains, les terminaux et les services associés à la stratégie d’investissement, ainsi que la donnée et les applications liées aux nouveaux usages de l’IA et à la manière dont nous consommerons et produirons l’information demain.","The technological transformation is just as important. It concerns the identity and security of agents relative to humans, the devices and services tied to the investment strategy, and the data and applications linked to new AI uses and to how we will consume and produce information tomorrow."],
["pull","Il est plus que jamais nécessaire de poser un diagnostic avant de choisir la technologie.","More than ever, we need a diagnosis before choosing the technology."],
["p","Le sujet le plus important n’est pas la technologie elle-même, mais la vision que l’organisation en a dans son propre contexte. Le livrable n’est plus le principal sujet : l’IA est désormais capable de produire des livrables de qualité. Ce qui compte, ce sont les idées et notre capacité à ouvrir le champ des possibles pour rendre les usages réellement innovants. Que peut véritablement débloquer l’IA ? Comment doit-elle aider à la créativité, à accélérer l’innovation, à maximiser les différenciants, à optimiser les offres et leur délivrance, au bénéfice de l’entreprise et de ses clients ?","The most important topic is not the technology itself, but the vision the organisation has of it in its own context. The deliverable is no longer the main point: AI can now produce quality deliverables. What matters are the ideas, and our ability to open up what is possible so that usage becomes truly innovative. What can AI really unlock? How should it support creativity, speed up innovation, maximise what sets us apart, and optimise offers and how they are delivered, for the benefit of the company and its clients?"],
["p","Ainsi, avant tout choix technologique, un diagnostic organisationnel doit mesurer l’impact potentiel de l’IA. Cet assessment peut s’appuyer sur cinq signaux :","So before any technology choice, an organisational diagnosis must measure AI’s potential impact. This assessment can rely on five signals:"],
["schema","signals"],
["p","À partir de ce diagnostic, l’organisation peut définir une trajectoire de transformation sur douze à vingt-quatre mois. Se projeter au-delà serait inapproprié à la réalité du marché compte tenu de la rapidité et de l’ampleur des évolutions technologiques.","From this diagnosis, the organisation can define a transformation trajectory over twelve to twenty-four months. Planning further ahead would not fit market reality, given the speed and scale of technological change."],
["p","Cette feuille de route doit permettre de suivre six grands chantiers :","This roadmap should track six major workstreams:"],
["schema","chantiers"],
["p","Elle doit surtout rester ancrée dans la réalité et s’appuyer sur un engagement à tous les niveaux de l’organisation, et bénéficier d’un sponsorship au plus haut niveau.","Above all, it must stay grounded in reality, rely on commitment at every level of the organisation, and have sponsorship at the very top."],
["p","Une fois la transformation engagée, il faut tenir le cap, animer et cadencer la roadmap. Le diagnostic ne marque que le début du chemin. La transformation se construit dans la durée, avec des interlocuteurs choisis, une veille stratégique continue sur l’IA, la mobilisation d’un réseau d’ambassadeurs et un appui constant d’un leadership fort et ambitieux pour l’organisation tout entière, le tout supporté par une méthodologie de conduite du changement.","Once the transformation is under way, we must hold course, drive the roadmap and keep its rhythm. The diagnosis is only the beginning of the road. Transformation is built over time, with the right counterparts, continuous strategic watch on AI, a mobilised network of ambassadors and the constant backing of strong, ambitious leadership for the whole organisation, all supported by a change-management methodology."]
]},
{id:"refresh",k:{fr:"Hit Refresh",en:"Hit Refresh"},t:{fr:"Faire un « Hit Refresh »",en:"Hitting “Refresh”"},pose:"heart",mood:"happy",scene:10,
sum:{fr:"Ce n’est pas un reboot technique. C’est l’occasion de nous redécouvrir, comme organisation et comme humains. Le cœur du sujet n’a jamais été la technologie : c’est notre posture. Et garder notre singularité.",en:"This isn’t a technical reboot. It’s a chance to rediscover ourselves, as organisations and as humans. The heart of it was never technology: it’s our stance. And keeping what makes us unique."},
bot:{fr:"Il y a un bouton, à la fin. Vous devinez lequel.",en:"There’s a button at the end. You can guess which one."},
B:[
["p","Je souhaite vous partager la métaphore venant d’un livre qui a marqué ma carrière professionnelle, <i>Hit Refresh</i> de Satya Nadella. Je pense que le changement de paradigme que nous vivons est l’occasion pour nous de faire un “<i>Hit Refresh</i>”. Pas un nième reboot technique, mais une réelle opportunité de nous redécouvrir en tant qu’organisation mais aussi et surtout en tant qu’humain : organiser un voyage et en maîtriser le parcours dans la durée, plutôt que de viser quelques destinations en particulier en imaginant pouvoir emprunter des raccourcis.","I’d like to share a metaphor from a book that shaped my professional career, Satya Nadella’s <i>Hit Refresh</i>. I believe the paradigm shift we are living through is our chance to “<i>Hit Refresh</i>”. Not yet another technical reboot, but a real opportunity to rediscover ourselves as an organisation, and above all as humans: to plan a journey and master its course over time, rather than aim for a few particular destinations imagining we can take shortcuts."],
["p","L’IA générative nous donne une occasion que le cloud n’a offerte qu’en partie : nous réinventer, retrouver un sens, et clarifier ce que nous apportons réellement, comme organisation et comme collectif humain. Il ne s’agit pas là uniquement d’une question d’adoption.","Generative AI gives us an opportunity the cloud only partly offered: to reinvent ourselves, find meaning again, and clarify what we truly bring, as an organisation and as a human collective. This is not just a question of adoption."],
["p","En effet, l’IA générative rend l’adoption plus fluide grâce à une expérience très accessible permise par le langage naturel et dans toutes ses formes : qu’il s’agisse de l’écrit, de la voix ou encore de l’image. C’est un atout majeur, mais ce n’est pas le cœur du sujet. Le cœur n’a en réalité jamais été la technologie, mais plutôt notre posture. Comment nous nous transformons, comment nous faisons ce “refresh” sur notre culture, nos décisions, nos modes de collaboration et nos façons de consommer et produire de l’information, sans nous dissoudre dans une généralisation et/ou une quête d’efficience sans fin.","Indeed, generative AI makes adoption smoother thanks to a highly accessible experience enabled by natural language in all its forms: written, spoken or visual. That is a major asset, but it isn’t the heart of the matter. The heart was never really the technology, but our stance. How we transform, how we “refresh” our culture, our decisions, our ways of collaborating and of consuming and producing information, without dissolving into sameness and/or an endless quest for efficiency."],
["p","La conduite du changement doit de mon point de vue, prendre une dimension plus profonde. Elle ne doit pas seulement se limiter à des méthodes, des jalons ou des suivis de métriques d’adoption. Elle doit protéger notre voix individuelle et collective, notre souveraineté intellectuelle, la souveraineté de nos processus et la légitimité de nos informations. Elle doit nous aider à ne pas tomber dans le piège de la production de discours interchangeables, de prises de décisions mécaniques et désincarnées, ou de contenus qui finissent par tous se ressembler. La conduite du changement doit nous permettre de garder notre singularité et d’éviter l’effet “tout se ressemble”, jusque dans nos présentations, nos écrits et nos décisions. En d’autres mots, cette transformation ne réussira que si nous gardons une posture claire, que nous résistons à l’uniformisation de la pensée et que nous maintenons notre quête de sens comme boussole.","In my view, change management must take on a deeper dimension. It must not be limited to methods, milestones or tracking adoption metrics. It must protect our individual and collective voice, our intellectual sovereignty, the sovereignty of our processes and the legitimacy of our information. It must help us avoid the trap of producing interchangeable discourse, mechanical and disembodied decisions, or content that ends up all looking the same. Change management must let us keep our singularity and avoid the “everything looks alike” effect, right down to our presentations, our writing and our decisions. In other words, this transformation will only succeed if we keep a clear stance, resist the standardisation of thought, and keep our search for meaning as our compass."],
["kural","Pour conclure, je vous partage un vers du <i>Tirukkural</i>, ce recueil de poèmes tamouls auquel je suis profondément attaché :|Quelle que soit la forme sous laquelle une chose se présente, la sagesse est d’en percevoir la vérité profonde|Kural 355, <i>Perception de la vérité</i>|C'est peut-être cela au fond, le <i>challenge</i> que pose le concept de <i>Frontier Firm.</i>","To conclude, I’d like to share a verse from the <i>Tirukkural</i>, the collection of Tamil poems I am deeply attached to:|Whatever form a thing may take, wisdom lies in perceiving its deeper truth|Kural 355, <i>Perceiving the Truth</i>|Perhaps that, in the end, is the real <i>challenge</i> posed by the idea of the <i>Frontier Firm.</i>"]
]}
]};</script>
<script>/* ===== Le monde : un panorama continu que l'on traverse, un univers par chapitre ===== */
const WORLD=(()=>{
const cv=document.getElementById('world'),g=cv.getContext('2d');
let W=0,H=0,DPR=1;const SPAN=2200;           // largeur d'un chapitre dans le monde
let cam=0,camT=0,tt=0,dark=false,mx=0,my=0;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rs(){DPR=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',rs);rs();
addEventListener('pointermove',e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});
/* palettes [haut, milieu, horizon, halo, collines lointaines, collines proches] */
const PL=[
 ['#BFD8FF','#E9E1FF','#FFE3D2','#FFC98A','#C9C3F2','#A99BE8'],
 ['#CFE0FF','#F1E6FF','#FFEBD8','#FFD37A','#CCC5F4','#AFA1EA'],
 ['#D7D0FF','#EEE3FF','#FFE6EE','#C7A8FF','#C7BDF0','#A592E6'],
 ['#C9DAF6','#E3E4F7','#F6EAF0','#A9C7FF','#BDC3E8','#9CA4DC'],
 ['#B9D1FF','#DCE3FF','#EEE9FF','#8FB8FF','#B5C0F0','#93A0E6'],
 ['#D1C4FF','#EADFFF','#FFE8F2','#B78CFF','#C4B5F2','#A28EE8'],
 ['#FFE2B8','#FFE9DA','#FFF1E4','#FFC23C','#F2CDBE','#E7AFA0'],
 ['#BEEBFA','#DDEFFF','#EEF3FF','#7FE3F2','#B5D3EE','#93B6E3'],
 ['#C1CCFF','#E0DCFF','#FFE9D6','#FFC23C','#B8BCEE','#9396DC'],
 ['#FFD6C2','#FFE6D2','#FFF3E0','#FFB79A','#E9C6C6','#D8A6B4'],
 ['#F3C9FF','#FFD9E8','#FFF0DA','#FFC23C','#E2BCE8','#C99ADB']];
const PD=[
 ['#060A2A','#17154A','#3A2459','#FF9A6A','#221C55','#2D2468'],
 ['#070B2C','#1A1650','#3B2A5C','#FFC060','#231D58','#2F266C'],
 ['#0A0830','#211656','#3F2263','#B48CFF','#261C5C','#312470'],
 ['#070C28','#14194A','#2A2552','#7FA8FF','#1C2150','#262C66'],
 ['#050B2C','#101C52','#22265E','#6FA0FF','#18215A','#202C70'],
 ['#0B0730','#24135A','#3F1D68','#A57BFF','#281A60','#352176'],
 ['#140A26','#2C1640','#4A2448','#FFB040','#2E1C48','#3C2558'],
 ['#04122A','#0B2348','#173459','#4FD8F0','#0F2850','#163566'],
 ['#070A2A','#151A50','#2E2458','#FFC23C','#1C1F55','#28296C'],
 ['#130B26','#2A1640','#4A2648','#FF9A7A','#2E1C46','#3C2556'],
 ['#12082C','#2C1250','#4A1E5A','#FFC23C','#2E1858','#3C206C']];
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,k)=>{const A=hx(a),B=hx(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`};
const rgba=(h,a)=>{const c=hx(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
/* bruit 1D */
const N=(x,s)=>{const i=Math.floor(x),f=x-i,r=k=>{const v=Math.sin((k+s*131.7)*12.9898)*43758.5453;return v-Math.floor(v)},u=f*f*(3-2*f);return r(i)*(1-u)+r(i+1)*u};
const fbm=(x,s)=>N(x,s)*.6+N(x*2.1,s+3)*.28+N(x*4.3,s+7)*.12;
/* graine pseudo-aléatoire */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
/* objets du monde : {c:chapitre, x, y(0..1), z(profondeur 0.2..1), t:type, s:taille, ph} */
const OBJ=[];
const TYPES=[['glass','eiffel','spark','glass'],['monitor','globe','phone','cloud'],['bulb','orb','spark','orb'],['fork','fog','orb','spark'],['island','node','bridge','island'],['window','window','brush','cube'],['coin','block','star','window'],['shield','badge','node','shield'],['coin','dc','sat','coin'],['sign','spark','orb','sign'],['petal','halo','petal','spark']];
for(let c=0;c<11;c++){const T=TYPES[c];for(let i=0;i<20;i++){const z=.25+rnd()*.75;OBJ.push({c,x:c*SPAN+rnd()*SPAN*1.1-SPAN*.05,y:.12+rnd()*.55,z,t:T[i%T.length],s:(.5+rnd()*.8)*(.5+z*.7),ph:rnd()*6.28,r:rnd()})}}
OBJ.sort((a,b)=>a.z-b.z);
const STARS=Array.from({length:160},()=>({x:rnd(),y:rnd()*.7,s:rnd()*1.4+.3,p:rnd()*6}));
/* ---- dessin des motifs ---- */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function glowDot(x,y,r,col,a=1){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(col,.9*a));gr.addColorStop(.35,rgba(col,.35*a));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
const COL={blue:'#1E7BF2',violet:'#6C3BE8',yellow:'#FFC23C',peach:'#FFB79A',cyan:'#38C8F0',white:'#FFFFFF',navy:'#14173D'};
function motif(o,x,y,s,a){g.save();g.translate(x,y);g.globalAlpha=a;const t=tt+o.ph;const wob=Math.sin(t*.8)*6*s;g.translate(0,wob);
 const W1=dark?'rgba(255,255,255,.10)':'rgba(255,255,255,.55)',ST=dark?'rgba(200,210,255,.35)':'rgba(255,255,255,.95)';
 switch(o.t){
 case 'glass':g.rotate(Math.sin(t*.3)*.08);rr(-60*s,-80*s,120*s,160*s,18*s);g.fillStyle=W1;g.fill();g.strokeStyle=ST;g.lineWidth=1.5;g.stroke();g.fillStyle=rgba(COL.violet,.25);rr(-44*s,-60*s,60*s,10*s,5*s);g.fill();rr(-44*s,-40*s,88*s,6*s,3*s);g.fill();break;
 case 'eiffel':{g.globalAlpha=a*.5;g.fillStyle=dark?'#3A3A7A':'#B9B2E6';g.beginPath();g.moveTo(0,-170*s);g.lineTo(14*s,-60*s);g.lineTo(46*s,60*s);g.lineTo(26*s,60*s);g.quadraticCurveTo(0,10*s,-26*s,60*s);g.lineTo(-46*s,60*s);g.lineTo(-14*s,-60*s);g.closePath();g.fill();break}
 case 'spark':{const k=.6+Math.sin(t*2)*.4;glowDot(0,0,26*s*k,o.r>.5?COL.yellow:COL.cyan);g.fillStyle='#fff';g.beginPath();for(let i=0;i<4;i++){const an=i*Math.PI/2;g.moveTo(0,0);g.quadraticCurveTo(Math.cos(an+.4)*4*s,Math.sin(an+.4)*4*s,Math.cos(an)*14*s*k,Math.sin(an)*14*s*k);g.quadraticCurveTo(Math.cos(an-.4)*4*s,Math.sin(an-.4)*4*s,0,0)}g.fill();break}
 case 'monitor':g.rotate(Math.sin(t*.4)*.1);rr(-50*s,-40*s,100*s,74*s,10*s);g.fillStyle=dark?'#3A3560':'#F3EEE2';g.fill();rr(-40*s,-31*s,80*s,54*s,6*s);g.fillStyle=dark?'#1B2A50':'#2B3C7A';g.fill();g.fillStyle=COL.cyan;g.fillRect(-32*s,-22*s,30*s,4*s);g.fillRect(-32*s,-14*s,44*s,4*s);g.fillStyle=dark?'#3A3560':'#E6DFCF';rr(-30*s,36*s,60*s,10*s,4*s);g.fill();break;
 case 'globe':glowDot(0,0,70*s,COL.blue,.6);g.strokeStyle=ST;g.lineWidth=2;g.beginPath();g.arc(0,0,40*s,0,7);g.stroke();g.beginPath();g.ellipse(0,0,16*s,40*s,t*.4,0,7);g.stroke();g.beginPath();g.moveTo(-40*s,0);g.lineTo(40*s,0);g.stroke();break;
 case 'phone':g.rotate(.15+Math.sin(t*.5)*.1);rr(-24*s,-46*s,48*s,92*s,10*s);g.fillStyle=dark?'#2A2650':'#1F2547';g.fill();rr(-19*s,-38*s,38*s,72*s,5*s);const gp=g.createLinearGradient(0,-38*s,0,34*s);gp.addColorStop(0,COL.blue);gp.addColorStop(1,COL.violet);g.fillStyle=gp;g.fill();g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<3;i++)for(let j=0;j<3;j++){rr(-14*s+j*10*s,-30*s+i*12*s,7*s,7*s,2*s);g.fill()}break;
 case 'cloud':case 'fog':g.fillStyle=dark?'rgba(150,140,230,.18)':'rgba(255,255,255,.75)';[[-40,0,30],[0,-14,38],[40,0,28],[16,10,30],[-16,10,28]].forEach(([a,b,r])=>{g.beginPath();g.arc(a*s,b*s,r*s,0,7);g.fill()});break;
 case 'bulb':case 'orb':{const c=o.r>.6?COL.yellow:o.r>.3?COL.violet:COL.blue;glowDot(0,0,60*s,c,.7);const gg=g.createRadialGradient(-8*s,-8*s,2,0,0,22*s);gg.addColorStop(0,'#fff');gg.addColorStop(1,rgba(c,.7));g.fillStyle=gg;g.beginPath();g.arc(0,0,22*s,0,7);g.fill();break}
 case 'fork':g.strokeStyle=rgba(COL.violet,.4);g.lineWidth=6*s;g.lineCap='round';g.beginPath();g.moveTo(0,60*s);g.lineTo(0,0);g.quadraticCurveTo(0,-30*s,-50*s,-60*s);g.moveTo(0,0);g.quadraticCurveTo(0,-30*s,50*s,-60*s);g.stroke();glowDot(-50*s,-60*s,20*s,COL.blue);glowDot(50*s,-60*s,20*s,COL.yellow);break;
 case 'island':{g.fillStyle=dark?'#2B2766':'#FFFFFF';g.beginPath();g.ellipse(0,0,80*s,16*s,0,0,7);g.fill();g.fillStyle=dark?'#1C1A4A':'#CFC6F4';g.beginPath();g.moveTo(-78*s,2*s);g.quadraticCurveTo(-20*s,70*s,0,90*s);g.quadraticCurveTo(20*s,70*s,78*s,2*s);g.fill();
  for(let i=0;i<3;i++){rr((-50+i*34)*s,(-30-i*8)*s,22*s,(30+i*8)*s,5*s);g.fillStyle=[COL.blue,COL.violet,COL.yellow][i];g.globalAlpha=a*.85;g.fill()}g.globalAlpha=a;glowDot(0,-50*s,40*s,COL.cyan,.5);break}
 case 'node':{const n=5;for(let i=0;i<n;i++){const an=i/n*6.28+t*.2,px=Math.cos(an)*50*s,py=Math.sin(an)*30*s;g.strokeStyle=rgba(COL.violet,.35);g.lineWidth=1.5;g.beginPath();g.moveTo(0,0);g.lineTo(px,py);g.stroke();glowDot(px,py,12*s,i%2?COL.cyan:COL.violet)}glowDot(0,0,22*s,COL.yellow);break}
 case 'bridge':g.strokeStyle=rgba(COL.cyan,.55);g.lineWidth=3;g.setLineDash([8,8]);g.lineDashOffset=-t*30;g.beginPath();g.moveTo(-120*s,0);g.quadraticCurveTo(0,-40*s,120*s,0);g.stroke();g.setLineDash([]);break;
 case 'window':{g.rotate(Math.sin(t*.35)*.12);const k=(Math.sin(t*.7)+1)/2;rr(-70*s,-50*s,140*s,100*s,12*s);g.fillStyle=dark?'rgba(40,36,90,.75)':'rgba(255,255,255,.85)';g.fill();g.strokeStyle=ST;g.stroke();
  g.fillStyle=rgba(COL.violet,.9);[0,1,2].forEach(i=>{g.beginPath();g.arc((-60+i*8)*s,-40*s,2.5*s,0,7);g.fill()});
  const gp=g.createLinearGradient(-60*s,0,60*s,0);gp.addColorStop(0,COL.blue);gp.addColorStop(1,COL.violet);g.fillStyle=gp;rr(-58*s,-28*s,(40+k*40)*s,(30-k*10)*s,6*s);g.fill();g.fillStyle=COL.yellow;rr((-14+k*40)*s,-28*s,(40-k*20)*s,(30+k*20)*s,6*s);g.fill();
  g.fillStyle=rgba(dark?'#FFFFFF':'#14173D',.15);for(let i=0;i<3;i++){rr(-58*s,(14+i*10)*s,(110-i*26)*s,5*s,2.5*s);g.fill()}break}
 case 'brush':g.strokeStyle=rgba(o.r>.5?COL.yellow:COL.peach,.75);g.lineWidth=10*s;g.lineCap='round';g.beginPath();g.moveTo(-70*s,10*s);g.bezierCurveTo(-30*s,-40*s+Math.sin(t)*10,20*s,50*s,70*s,-20*s);g.stroke();break;
 case 'cube':{g.rotate(t*.2);const c=[COL.blue,COL.violet,COL.cyan];g.fillStyle=c[0];g.beginPath();g.moveTo(0,-30*s);g.lineTo(26*s,-15*s);g.lineTo(0,0);g.lineTo(-26*s,-15*s);g.fill();g.fillStyle=c[1];g.beginPath();g.moveTo(-26*s,-15*s);g.lineTo(0,0);g.lineTo(0,30*s);g.lineTo(-26*s,15*s);g.fill();g.fillStyle=c[2];g.beginPath();g.moveTo(26*s,-15*s);g.lineTo(0,0);g.lineTo(0,30*s);g.lineTo(26*s,15*s);g.fill();break}
 case 'coin':{g.scale(Math.abs(Math.cos(t*1.2))*.9+.1,1);const gc=g.createRadialGradient(-6*s,-6*s,1,0,0,22*s);gc.addColorStop(0,'#FFF4C8');gc.addColorStop(1,'#F2A900');g.fillStyle=gc;g.beginPath();g.arc(0,0,20*s,0,7);g.fill();g.strokeStyle='#D88C00';g.lineWidth=2;g.stroke();g.fillStyle='#B87000';g.font=`700 ${18*s}px Figtree,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('T',0,1);break}
 case 'block':{const c=[COL.yellow,COL.peach,COL.violet][Math.floor(o.r*3)];rr(-24*s,-24*s,48*s,48*s,8*s);g.fillStyle=c;g.fill();g.fillStyle='rgba(255,255,255,.6)';g.font=`800 ${26*s}px Figtree,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('?',0,2*s);break}
 case 'star':{g.rotate(t*.5);g.fillStyle=COL.yellow;g.beginPath();for(let i=0;i<10;i++){const r=(i%2?10:24)*s,an=i*Math.PI/5;g.lineTo(Math.sin(an)*r,-Math.cos(an)*r)}g.fill();glowDot(0,0,40*s,COL.yellow,.4);break}
 case 'shield':{glowDot(0,0,70*s,COL.cyan,.5);g.beginPath();g.moveTo(0,-44*s);g.lineTo(36*s,-30*s);g.quadraticCurveTo(36*s,24*s,0,46*s);g.quadraticCurveTo(-36*s,24*s,-36*s,-30*s);g.closePath();g.fillStyle=dark?'rgba(60,80,140,.6)':'rgba(255,255,255,.85)';g.fill();g.strokeStyle=COL.cyan;g.lineWidth=2.5;g.stroke();g.strokeStyle=COL.blue;g.lineWidth=4*s;g.beginPath();g.moveTo(-12*s,0);g.lineTo(-2*s,10*s);g.lineTo(16*s,-10*s);g.stroke();break}
 case 'badge':{rr(-34*s,-44*s,68*s,88*s,10*s);g.fillStyle=dark?'rgba(40,40,100,.8)':'#FFFFFF';g.fill();g.fillStyle=COL.cyan;rr(-34*s,-44*s,68*s,18*s,10*s);g.fill();g.fillStyle='#E9EEFF';g.beginPath();g.arc(0,-2*s,14*s,0,7);g.fill();g.fillStyle=COL.cyan;g.beginPath();g.arc(-5*s,-3*s,2.4*s,0,7);g.arc(5*s,-3*s,2.4*s,0,7);g.fill();g.fillStyle='rgba(20,23,61,.2)';rr(-22*s,20*s,44*s,5*s,2.5*s);g.fill();rr(-16*s,30*s,32*s,5*s,2.5*s);g.fill();break}
 case 'dc':{for(let i=0;i<3;i++){rr((-60+i*42)*s,-40*s,36*s,80*s,6*s);g.fillStyle=dark?'#232060':'#E9E6FB';g.fill();for(let j=0;j<6;j++){g.fillStyle=(Math.sin(t*3+i+j)>.3)?COL.cyan:'rgba(108,59,232,.35)';g.fillRect((-54+i*42)*s,(-32+j*12)*s,8*s,4*s)}}
  for(let k=0;k<5;k++){const p=((t*.3+k/5)%1);glowDot(60*s+p*120*s,-30*s-p*80*s,8*s,COL.yellow,1-p)}break}
 case 'sat':{g.strokeStyle=rgba(COL.violet,.3);g.beginPath();g.ellipse(0,0,90*s,30*s,-.2,0,7);g.stroke();const an=t*.6,px=Math.cos(an)*90*s,py=Math.sin(an)*30*s;g.save();g.translate(px,py-Math.cos(an)*18*s);g.fillStyle='#E9E6FB';g.fillRect(-8*s,-6*s,16*s,12*s);g.fillStyle=COL.blue;g.fillRect(-30*s,-4*s,18*s,8*s);g.fillRect(12*s,-4*s,18*s,8*s);g.restore();glowDot(0,0,30*s,COL.blue,.6);break}
 case 'sign':{g.fillStyle=dark?'#3C3670':'#D9CFF5';g.fillRect(-3*s,-10*s,6*s,80*s);rr(-50*s,-40*s,90*s,26*s,8*s);g.fillStyle=COL.yellow;g.fill();g.beginPath();g.moveTo(40*s,-40*s);g.lineTo(56*s,-27*s);g.lineTo(40*s,-14*s);g.fill();break}
 case 'petal':{g.rotate(t*.6+o.ph);g.fillStyle=o.r>.5?'#FFC7DA':'#FFE2A8';g.beginPath();g.ellipse(0,0,12*s,6*s,0,0,7);g.fill();break}
 case 'halo':{g.strokeStyle=rgba(COL.yellow,.5);g.lineWidth=6*s;g.beginPath();g.arc(0,0,70*s,t*.4,t*.4+5.2);g.stroke();g.fillStyle=rgba(COL.yellow,.6);const e=t*.4+5.2;g.beginPath();g.moveTo(Math.cos(e)*70*s+10*s,Math.sin(e)*70*s);g.lineTo(Math.cos(e)*70*s-10*s,Math.sin(e)*70*s);g.lineTo(Math.cos(e+.15)*82*s,Math.sin(e+.15)*82*s);g.fill();break}
 }
 g.restore()}
/* ---- rendu ---- */
function frame(){requestAnimationFrame(frame);tt+=RM?0:1/60;cam+=(camT-cam)*.045;
 const P=dark?PD:PL,cf=cam/SPAN,c0=Math.max(0,Math.min(10,Math.floor(cf))),c1=Math.min(10,c0+1),k=Math.max(0,Math.min(1,(cf-c0-.55)/.45));

(()=>{let t0=performance.now();const loop=n=>{requestAnimationFrame(loop);if(!BD.classList.contains('on')||curSc<0)return;const cv=BD.querySelector('.dc'),d=Math.min(devicePixelRatio||1,2),w=BD.clientWidth,h=BD.clientHeight;
 if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);drawDecor(g,w,h,(n-t0)/1000,curSc,document.documentElement.dataset.theme==='dark')};requestAnimationFrame(loop)})();

    g.strokeStyle='#6C3BE8';g.lineWidth=2.5*S;g.setLineDash([5*S,5*S]);g.lineDashOffset=-t*20;g.beginPath();g.moveTo(X+bw*.14,y+bh*.24);g.quadraticCurveTo(X+bw*.5,y+bh*.05,X+bw*.74,y+bh*.66);g.stroke();g.setLineDash([])}

    for(let i=0;i<5;i++){g.fillStyle=rgbaH('#38C8F0',.8);const hh=(.2+.6*Math.abs(Math.sin(t*1.5+i)))*bh*.4;g.fillRect(X+20*S+i*22*S,y+bh*.75-hh,14*S,hh)}}
   else if(v==='agents'){for(let i=0;i<5;i++){const a=t*.6+i*1.256,px=X+bw/2+Math.cos(a)*bw*.3,py=y+bh/2+Math.sin(a)*bh*.28;g.strokeStyle='rgba(127,243,255,.35)';g.lineWidth=1.5*S;g.beginPath();g.moveTo(X+bw/2,y+bh/2);g.lineTo(px,py);g.stroke();g.fillStyle=i%2?'#6C3BE8':'#1E7BF2';g.beginPath();g.roundRect(px-9*S,py-9*S,18*S,18*S,5*S);g.fill()}
    g.fillStyle='#FFC23C';g.beginPath();g.arc(X+bw/2,y+bh/2,13*S,0,7);g.fill()}
   else if(v==='game'){g.fillStyle='#14173D';g.fillRect(X+8*S,y+8*S,bw-16*S,bh-16*S);for(let i=0;i<8;i++){g.fillStyle=['#FFC23C','#38C8F0','#E8553A','#9FE6B8'][i%4];g.fillRect(X+16*S+i*bw*.1,y+bh*.7-((i*37)%5)*6*S,bw*.08,8*S)}
    const jx=X+bw*.1+((t*50*S)%(bw*.8)),jy=y+bh*.55-Math.abs(Math.sin(t*4))*24*S;g.fillStyle='#FFB79A';g.fillRect(jx,jy,10*S,12*S)}
   else if(v==='road'){g.strokeStyle='#6C3BE8';g.lineWidth=4*S;g.beginPath();g.moveTo(X+16*S,y+bh*.8);g.bezierCurveTo(X+bw*.35,y+bh*.2,X+bw*.6,y+bh*.95,X+bw-16*S,y+bh*.25);g.stroke();
    [[.1,.78],[.45,.55],[.86,.3]].forEach(([a,b],i)=>{const px=X+bw*a,py=y+bh*b;g.fillStyle='#5A4E86';g.fillRect(px,py-26*S,2.5*S,26*S);g.fillStyle=['#FFC23C','#38C8F0','#E8553A'][i];g.beginPath();g.moveTo(px+2*S,py-26*S);g.lineTo(px+22*S+Math.sin(t*4+i)*3*S,py-20*S);g.lineTo(px+2*S,py-14*S);g.fill()})}
   else if(v==='refresh'||v==='ff'){g.fillStyle='#6C3BE8';g.font=`800 ${(v==='ff'?24:22)*S}px Figtree,sans-serif`;g.textAlign='center';g.fillText(v==='ff'?'Frontier Firm':'Hit Refresh',X+bw/2,y+bh*.42);
    g.strokeStyle='#FFC23C';g.lineWidth=5*S;g.beginPath();g.arc(X+bw/2,y+bh*.7,16*S,t*2,t*2+4.8);g.stroke();g.textAlign='left'}
 g.restore()}
